<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>  Starry Night Login Form</title>
<link rel="stylesheet" href="style.css"></head>
<body>
    <div class="container">
    <form action=" #">
        <fieldset>
            <legend><h2 >User Personal Information</h2></legend>
            <label for="name">Enter your Full Name:</label><br>
            <input type="text" placeholder="Enter Your Name"  id="name" name="name" required><br>
            <label for="password">Enter Your Password:</label><br>
            <input type="password" id="password" placeholder="Enter Your Password" name="password" required><br>

            <label for="email">Enter Your Email:</label><br>
            <input type="email" id="email" placeholder="Enter Your Email" name="email" required><br>
            <label for="tel" >Enter Your Number:</label><br>

                        <label for="female">Female</label>
            <input type="radio" id="others" name="Gender" value="others">
                        <label for="others">Others</label><br><br>
            <label for="dob">Enter Your Date of Birth:</label><br>
                 <input type="date" id="dob" name="dob" required><br>
            <label for="file">Choose a File:</label><br>
            <input type="file" id="file" required name="file"><br>

<label for="add">Enter Your Address:</label><br>
<textarea id="add" name="Address"cols="30" required></textarea><br>



<input type="submit" value="Submit"><br>
<input type="reset" value="Reset">
       <p style="text-align: center;"> Created by 🌸Safia Parveen🌸</p>
        </fieldset>

    </form>
    </div>
</body>
</html>
