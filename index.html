<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<body>
<div class="container">

<form action="#">

<fieldset>
<legend>User Personal Information</legend>

<label>Enter your Full Name:</label><br>
<input type="text" placeholder="Enter Your Name" name="name" required><br><br>

<label>Enter Your Password:</label><br>
<input type="password" placeholder="Enter Your Password" name="password" required><br><br>

<label>Enter Your Email:</label><br>
<input type="email" placeholder="Enter Your Email" name="email" required><br><br>

<label>Enter Your Number:</label><br>
<input type="tel" placeholder="Enter Your Phone Number" name="phone" required><br><br>

<label>Gender:</label><br>

<input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label>

<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label>

<input type="radio" id="others" name="gender" value="others">
<label for="others">Others</label>

<br><br>

<label>Date of Birth:</label><br>
<input type="date" name="dob" required><br><br>

<label>Upload File:</label><br>
<input type="file" name="file" required><br><br>

<label>Address:</label><br>
<textarea name="address" cols="30" required></textarea><br><br>

<input type="submit" value="Submit"><br>
<input type="reset" value="Reset">

<p style="text-align:center;">Created by 🌸 Safia Parveen 🌸</p>

</fieldset>

</form>

</div>
</body>
</html>
